[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cst-libraries"
version = "0.3.0"
description = "CST/COSMOS persistent-state computation SDK, adapters, native core, CST-L runtime, and packaged apps"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Cory Shane Davis"}]
keywords = ["cst", "cosmos", "dynamic-state", "memory", "hebbian", "dsl", "agents", "transformer"]
classifiers = ["Development Status :: 3 - Alpha","Intended Audience :: Developers","Intended Audience :: Science/Research","License :: OSI Approved :: Apache Software License","Programming Language :: Python :: 3","Programming Language :: Python :: 3 :: Only","Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]
torch = ["torch>=2.4"]
native = ["pybind11>=2.11"]
ibm = ["qiskit>=2.0", "qiskit-ibm-runtime>=0.37"]
azure = ["azure-quantum"]

[project.scripts]
cst = "cstlib.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

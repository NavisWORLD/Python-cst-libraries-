name: CI

on:
  push:
  pull_request:

jobs:
  python-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - run: cst doctor
      - run: cst inspect examples/hello.cst
      - run: cst run examples/hello.cst --message "CI hello"
      - run: printf '%s\n' '{"op":"affinity","a":[0,1],"b":[1,0],"sigma":1}' | python tools/synaptic_bridge.py
      - run: python -m build

  python-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev,torch]"
      - run: python -m pytest
      - run: python examples/transformer_demo.py

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCST_BUILD_TESTS=ON
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/cpp/cst_cpp_demo

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "cosmic rust"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - run: cargo build
      - run: cargo run --example quickstart

  native-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pybind11
      - run: cmake -S . -B build-native -DCST_BUILD_TESTS=OFF -DCST_BUILD_PYTHON_BINDINGS=ON -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - run: cmake --build build-native -j2
      - run: PYTHONPATH=build-native/cpp python -c "import _cst_native as n; s=n.DynamicState(12); assert len(s.update([1.0]))==12; f=n.SynapticFunction(.75,.35); assert abs(f.affinity([0,1,-1,.5],[.5,.5,-.5,1])-.41111229050718745)<1e-12"

  synaptic-ports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: node bindings/javascript/test.mjs
      - run: npm install --no-save typescript && npx tsc --strict --module nodenext --moduleResolution nodenext --target es2022 --noEmit bindings/javascript/test.ts
      - run: cd bindings/go && go test ./...
      - run: mkdir -p /tmp/cst-java && javac -d /tmp/cst-java bindings/java/Synaptic.java bindings/java/SynapticTest.java && java -cp /tmp/cst-java SynapticTest
      - run: dotnet run --project bindings/csharp/CstSynaptic.csproj

  synaptic-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc bindings/swift/Synaptic.swift bindings/swift/main.swift -o /tmp/cst-synaptic-swift
      - run: /tmp/cst-synaptic-swift
